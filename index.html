<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stoner Network | Elevate the Conversation</title>
    <style>
        /* CSS - This is the "Style" and "Vibe" */
        :root {
            --primary-green: #2ecc71;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
        }

        h1 {
            font-size: 4rem;
            color: var(--primary-green);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .cta-button {
            background-color: var(--primary-green);
            color: black;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover {
            transform: scale(1.1);
        }

        .content-section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid var(--primary-green);
        }
    </style>
</head>
<body>

    <header>
        <h1>THE STONER NETWORK</h1>
        <p>A global collective for the elevated mind.</p>
        <a href="#" class="cta-button">ENTER THE NETWORK</a>
    </header>

    <section class="content-section">
        <div class="card">
            <h3>The Podcast</h3>
            <p>Weekly deep dives into culture, science, and the community.</p>
        </div>
        <div class="card">
            <h3>Community</h3>
            <p>Connect with members globally in our encrypted lounge.</p>
        </div>
        <div class="card">
            <h3>The Shop</h3>
            <p>Exclusive drops and network-certified accessories.</p>
        </div>
    </section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stoner Network | Official Hub</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <nav>
        <div class="logo">
            <img src="The Stoner Network Logo (Banner).png" alt="TSN Logo">
        </div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#shop">Shop</a>
            
            <!-- User Menu -->
            <div class="user-menu-container">
                <a onclick="openModal()" class="join-link">Join Network</a>
                <div id="user-dropdown" class="dropdown-content">
                    <a href="profile.html">👤 Profile</a>
                    <a href="account.html">⚙️ Settings</a>
                    <hr>
                    <a onclick="handleLogout()" class="logout-link">🚪 Logout</a>
                </div>
            </div>

            <!-- Cart Trigger -->
            <a onclick="toggleCart()" style="cursor:pointer;">🛒 Cart (<span id="cart-count">0</span>)</a>
        </div>
    </nav>

    <header>
        <h1>THE STONER NETWORK</h1>
        <p>Elevate your digital experience across every device.</p>
        <button class="btn hero-btn" onclick="location.href='#shop'">Enter the Shop</button>
    </header>

    <section id="shop">
        <div class="grid">
            <div class="card">
                <h3>Heavyweight Hoodie</h3>
                <p>$55.00</p>
                <button class="btn" onclick="addToCart('Heavyweight Hoodie', 55)">Add to Stash</button>
            </div>
            <div class="card">
                <h3>Glow Rolling Tray</h3>
                <p>$25.00</p>
                <button class="btn" onclick="addToCart('Glow Rolling Tray', 25)">Add to Stash</button>
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar">
        <div class="cart-header" style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Your Cart</h2>
            <span onclick="toggleCart()" style="cursor:pointer; font-size:24px;">&times;</span>
        </div>
        <div id="cart-content">
            <p id="empty-msg">Your stash is empty.</p>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <h3>Total: $<span id="cart-total">0.00</span></h3>
        <button class="btn" style="width:100%;" onclick="checkout()">Checkout</button>
    </div>

    <!-- Auth Modal -->
    <div id="network-modal" class="modal">
        <div class="modal-tabs" style="display:flex; gap:10px; margin-bottom:20px;">
            <button onclick="showTab('login')" class="btn" style="flex:1;">Login</button>
            <button onclick="showTab('signup')" class="btn" style="flex:1; background:#444; color:white;">Sign Up</button>
        </div>
        <div id="login-form-container">
            <form onsubmit="handleLogin(event)">
                <input type="email" placeholder="Email" required style="width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #333; background:#222; color:white;">
                <input type="password" placeholder="Password" required style="width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #333; background:#222; color:white;">
                <button type="submit" class="btn" style="width:100%;">Login</button>
            </form>
        </div>
        <div id="signup-form-container" style="display:none;">
            <form id="network-form">
                <input type="text" name="username" placeholder="Username" required style="width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #333; background:#222; color:white;">
                <input type="email" name="email" placeholder="Email" required style="width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #333; background:#222; color:white;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #333; background:#222; color:white;">
                <button type="submit" class="btn" style="width:100%;">Create Account</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

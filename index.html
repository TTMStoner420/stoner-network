<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stoner Network | Official Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <nav>
        <div class="logo">
            <img src="The Stoner Network Logo (Banner).png" alt="TSN Logo">
        </div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#shop">Shop</a>
            
            <!-- THE DROPDOWN STRUCTURE -->
            <div class="user-menu-container">
                <a onclick="openModal()" class="join-link">Join Network</a>
                <div id="user-dropdown" class="dropdown-content">
                    <a href="profile.html">👤 Profile</a>
                    <a href="account.html">⚙️ Settings</a>
                    <hr>
                    <a onclick="handleLogout()" class="logout-link">🚪 Logout</a>
                </div>
            </div>

            <a onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</a>
        </div>
    </nav>

    <header>
        <h1>THE STONER NETWORK</h1>
        <p>Elevate your digital experience across every device.</p>
        <button class="btn hero-btn" onclick="location.href='#shop'">Enter the Shop</button>
    </header>

    <section id="shop">
        <div class="grid">
            <div class="card">
                <h3>Heavyweight Hoodie</h3>
                <p>$55.00</p>
                <button class="btn" onclick="addToCart('Heavyweight Hoodie', 55)">Add to Stash</button>
            </div>
        </div>
    </section>

    <div id="network-modal" class="modal">
        <div class="modal-tabs">
            <button onclick="showTab('login')" class="tab-btn active">Login</button>
            <button onclick="showTab('signup')" class="tab-btn">Sign Up</button>
        </div>
        <div id="login-form-container">
            <form onsubmit="handleLogin(event)">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
        <div id="signup-form-container" style="display:none;">
            <form id="network-form">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
